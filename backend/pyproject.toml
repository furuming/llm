[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.3",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pymysql>=1.2.0",
    "uvicorn>=0.47.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "C4", "D", ]
ignore = ["D400","D415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
