services:
  web:
    image: caddy:latest
    ports:
      - 8080:8080
    volumes:
      - ./.docker/caddy/Caddyfile:/etc/caddy/Caddyfile
#      - ./.docker/caddy/data:/data
#      - ./.docker/caddy/config:/config
  backend:
    build:
      context: ./backend
    ports:
      - 19000:9000
    restart: unless-stopped
    volumes:
      - ./backend:/app:rw
    tty: true
    environment:
      - LOCAL_LLM_BASE_URL=http://core:9000

  frontend:
    build:
      context: ./frontend
    ports:
      - 13000:3000
    restart: unless-stopped
    tty: true
    volumes:
      - ./frontend:/var/www/frontend:rw
  # core:
  #   build:
  #     context: ../llm_core
  #   restart: unless-stopped
  #   volumes:
  #     - ./data:/data
  #   environment:
  #     - GPU=NVIDIA
  db:
    image: mysql:latest
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=llm
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - ./.docker/mysql/data:/var/lib/mysql
  vdb:
    image: qdrant/qdrant:latest
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - ./.docker/qdrant/storage:/qdrant/storage
      - ./.docker/qdrant/snapshots:/qdrant/snapshots
      - ./.docker/qdrant/config/production.yaml:/qdrant/config/production.yaml:ro

  vdb-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - vdb
    environment:
      - QDRANT_URL=http://vdb:6333
    volumes:
      - ./.docker/qdrant/collections:/collections:ro
      - ./.docker/qdrant/scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/apply-collections.sh"]
    restart: "no"
